<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>权限管理</title>
    <link href="../../css/bootstrap.min.css" rel="stylesheet">
    <link href="../../css/fonts.css" rel="stylesheet">
    <link href="../../css/home.css" rel="stylesheet">
    <style>
        .role-card {
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            margin-bottom: 16px;
        }
        .role-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .role-card.active {
            border-color: #6c5ce7;
            background: #f8f7ff;
        }
        .role-card .card-header {
            background: #f8f9fa;
            padding: 12px 16px;
        }
        .permission-tree {
            max-height: 500px;
            overflow-y: auto;
        }
        .permission-tree .perm-item {
            padding: 6px 0;
            border-bottom: 1px solid #f1f3f5;
        }
        .permission-tree .perm-item:last-child {
            border-bottom: none;
        }
        .permission-tree .perm-item .perm-label {
            font-size: 14px;
            color: #495057;
        }
        .permission-tree .perm-item .perm-label:hover {
            color: #6c5ce7;
        }
        .perm-level-1 { padding-left: 0; }
        .perm-level-2 { padding-left: 30px; }
        .perm-level-3 { padding-left: 60px; }
        .perm-group-title {
            font-weight: 600;
            color: #2d3748;
            padding: 10px 0;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 8px;
        }
        .btn-sm-custom {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
        }
        .role-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }
        .role-badge-admin { background: #cce5ff; color: #004085; }
        .role-badge-manager { background: #d4edda; color: #155724; }
        .role-badge-user { background: #e2e3e5; color: #383d41; }
        .checkbox-custom {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            cursor: pointer;
        }
        .spinning {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<main class="ftdms-layout-content">
    <div class="container-fluid" style="margin-bottom:90px;">
        
        <!-- 统计卡片 -->
        <div class="row" style="margin-top:15px;">
            <div class="col-sm-6 col-lg-3">
                <div class="card bg-primary">
                    <div class="card-body clearfix">
                        <div class="pull-left">
                            <p class="h6 text-white m-t-0">角色总数</p>
                            <p class="h3 text-white m-b-0" id="totalRoles">0</p>
                        </div>
                        <div class="pull-right">
                            <span class="img-avatar img-avatar-48 bg-translucent">
                                <i class="glyphicon glyphicon-user fa-1-5x"></i>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <div class="card bg-success">
                    <div class="card-body clearfix">
                        <div class="pull-left">
                            <p class="h6 text-white m-t-0">权限总数</p>
                            <p class="h3 text-white m-b-0" id="totalPermissions">0</p>
                        </div>
                        <div class="pull-right">
                            <span class="img-avatar img-avatar-48 bg-translucent">
                                <i class="glyphicon glyphicon-lock fa-1-5x"></i>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <div class="card bg-warning">
                    <div class="card-body clearfix">
                        <div class="pull-left">
                            <p class="h6 text-white m-t-0">已分配用户</p>
                            <p class="h3 text-white m-b-0" id="totalAssignedUsers">0</p>
                        </div>
                        <div class="pull-right">
                            <span class="img-avatar img-avatar-48 bg-translucent">
                                <i class="glyphicon glyphicon-ok-circle fa-1-5x"></i>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <div class="card bg-purple">
                    <div class="card-body clearfix">
                        <div class="pull-left">
                            <p class="h6 text-white m-t-0">菜单组</p>
                            <p class="h3 text-white m-b-0" id="totalMenuGroups">0</p>
                        </div>
                        <div class="pull-right">
                            <span class="img-avatar img-avatar-48 bg-translucent">
                                <i class="glyphicon glyphicon-th-list fa-1-5x"></i>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- 左侧：角色列表 -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h4><i class="glyphicon glyphicon-user"></i> 角色列表</h4>
                        <div class="pull-right">
                            <button class="btn btn-primary btn-sm" id="addRoleBtn">
                                <i class="glyphicon glyphicon-plus"></i> 新增
                            </button>
                            <button class="btn btn-success btn-sm" id="refreshRolesBtn">
                                <i class="glyphicon glyphicon-refresh"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body" style="padding: 8px;">
                        <div id="roleList">
                            <!-- 角色列表由 JS 动态渲染 -->
                            <div class="text-center text-muted" style="padding: 40px 0;">
                                <i class="glyphicon glyphicon-refresh spinning"></i> 加载中...
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：权限配置 -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4 id="permissionTitle"><i class="glyphicon glyphicon-lock"></i> 权限配置</h4>
                        <div class="pull-right">
                            <button class="btn btn-primary btn-sm" id="savePermissionBtn">
                                <i class="glyphicon glyphicon-save"></i> 保存权限
                            </button>
                            <button class="btn btn-default btn-sm" id="selectAllBtn">
                                <i class="glyphicon glyphicon-check"></i> 全选
                            </button>
                            <button class="btn btn-default btn-sm" id="deselectAllBtn">
                                <i class="glyphicon glyphicon-unchecked"></i> 取消全选
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="permissionTree" class="permission-tree">
                            <!-- 权限树由 JS 动态渲染 -->
                            <div class="text-center text-muted" style="padding: 60px 0;">
                                <i class="glyphicon glyphicon-hand-left" style="font-size: 32px;"></i>
                                <p style="margin-top: 12px;">请从左侧选择一个角色</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- 新增/编辑角色模态框 -->
<div class="modal fade" id="roleModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-sm" role="document">
        <div class="modal-content">
            <div class="modal-header" style="background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: #fff;">
                <h5 class="modal-title" id="roleModalTitle"><i class="glyphicon glyphicon-plus"></i> 新增角色</h5>
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-body">
                <form id="roleForm">
                    <input type="hidden" id="editRoleId">
                    <div class="form-group">
                        <label>角色名称 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="roleName" placeholder="请输入角色名称" required>
                        <small class="text-muted">例如：管理员、编辑、访客</small>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="saveRoleBtn">
                    <i class="glyphicon glyphicon-save"></i> 保存
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 删除确认模态框 -->
<div class="modal fade" id="deleteModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-sm" role="document">
        <div class="modal-content">
            <div class="modal-header" style="background: #dc3545; color: #fff;">
                <h5 class="modal-title"><i class="glyphicon glyphicon-trash"></i> 确认删除</h5>
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-body">
                <p>确定要删除角色 <strong id="deleteRoleName"></strong> 吗？</p>
                <p class="text-danger"><small>此操作将移除该角色的所有权限分配，不可恢复！</small></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
                    <i class="glyphicon glyphicon-trash"></i> 确认删除
                </button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" src="../../js/jquery-2.1.1.min.js"></script>
<script src="../../js/bootstrap.min.js"></script>
<script src="../../js/app/user/userInfo.js"></script>
<script src="../../js/utils/constantUtils.js"></script>
<script src="../../js/utils/memoryUtils.js"></script>
<script src="../../js/utils/storageUtils.js"></script>
<script src="../../js/app/manager/permission.js"></script>
</body>
</html>
